name: Deploy Firebase on merge

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 파일 가져오기
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Firebase CLI 설치
        run: npm install -g firebase-tools

      - name: Firebase 서비스 계정 파일 생성
        shell: bash
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JY_SCIENCE_APP }}' > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Firebase Hosting 및 Firestore 규칙 배포
        run: firebase deploy --only "hosting,firestore:rules" --project jy-science-app
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json