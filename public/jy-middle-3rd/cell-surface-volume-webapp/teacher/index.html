<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>교사용 탐구 평가 대시보드</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .teacher-login-view{min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f7fb}
    .teacher-login-card{width:min(460px,100%);background:#fff;border:1px solid #d8e0ef;border-radius:24px;padding:32px;box-shadow:0 18px 48px rgba(28,48,86,.12)}
    .teacher-login-card h1{margin:6px 0 12px}.teacher-login-card .primary{width:100%;margin-top:18px}
    .header-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.header-actions span{font-size:13px}
    .hidden{display:none!important}
  </style>
</head>
<body>
  <section id="teacherLoginView" class="teacher-login-view">
    <div class="teacher-login-card">
      <p class="eyebrow">교사용 인증</p>
      <h1>Google 계정으로 로그인</h1>
      <p>등록된 교사 계정만 학생 제출 자료와 평가 화면에 접근할 수 있습니다.</p>
      <button id="teacherLoginBtn" class="primary" type="button">Google 로그인</button>
      <p id="teacherLoginMessage" class="message"></p>
    </div>
  </section>
  <div id="teacherAppView" class="hidden">
  <header class="topbar">
    <div>
      <p class="eyebrow">교사용 통합 대시보드</p>
      <h1>세포의 표면적과 부피 탐구 평가</h1>
    </div>
    <div class="header-actions"><span id="teacherAccount"></span><button id="refreshBtn" class="ghost" type="button">새로고침</button><button id="teacherLogoutBtn" class="ghost" type="button">로그아웃</button></div>
  </header>

  <main class="dashboard">
    <section class="toolbar">
      <label>
        <span>학년도</span>
        <input id="yearFilter" value="2026" />
      </label>
      <label>
        <span>반</span>
        <input id="classFilter" placeholder="전체" />
      </label>
      <label>
        <span>상태</span>
        <select id="statusFilter">
          <option value="">전체</option>
          <option value="submitted">제출 완료</option>
          <option value="evaluated">평가 완료</option>
          <option value="unsubmitted">미제출</option>
        </select>
      </label>
      <div class="toolbar-actions">
        <button id="applyFilterBtn" class="primary" type="button">조회</button>
        <button id="exportExcelBtn" class="excel-btn" type="button">현재 반 엑셀 다운로드</button>
      </div>
    </section>

    <section class="summary-grid">
      <article class="summary-card"><span>전체 제출</span><strong id="totalCount">0</strong></article>
      <article class="summary-card"><span>평가 대기</span><strong id="pendingCount">0</strong></article>
      <article class="summary-card"><span>평가 완료</span><strong id="evaluatedCount">0</strong></article>
    </section>

    <section class="workspace">
      <aside class="student-list-panel">
        <div class="panel-head">
          <h2>학생 목록</h2>
          <span id="listCount">0명</span>
        </div>
        <div id="studentList" class="student-list">
          <p class="empty">학생 제출 자료가 없습니다.</p>
        </div>
      </aside>

      <section id="detailPanel" class="detail-panel">
        <div class="empty-detail">
          <h2>학생을 선택하세요</h2>
          <p>왼쪽 목록에서 학생을 선택하면 탐구 결과와 평가 영역이 표시됩니다.</p>
        </div>
      </section>
    </section>
  </main>
  </div>

  <script src="../common/firebase-ai-config.js"></script>
  <script type="module" src="../common/firebase-ai.js"></script>
  <script type="module" src="../common/firebase-data.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
